<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Batalla Naval contra una IA que calcula la probabilidad de dónde está tu flota.">
    <link rel="stylesheet" href="styles.css">
    <title>🚢 Batalla Naval - Juego Épico</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚢</text></svg>">
</head>
<body>
    <div class="game-container">
        <h1>⚓ BATALLA NAVAL ⚓</h1>
        <p class="subtitulo">Vos contra una IA que calcula dónde está escondida tu flota</p>

        <div class="control-panel">
            <label class="selector-dificultad" id="selector-dificultad">
                Dificultad
                <select id="dificultad">
                    <option value="facil">Fácil</option>
                    <option value="medio">Medio</option>
                    <option value="dificil" selected>Difícil</option>
                </select>
            </label>
            <button id="boton-iniciar" class="boton-iniciar">🚀 Iniciar Misión</button>
            <button id="boton-parar" class="boton-parar" hidden>🛑 Abortar</button>
            <button id="boton-reiniciar" class="boton-reiniciar" hidden>🔄 Nueva Misión</button>
        </div>

        <p id="estado" class="estado" aria-live="polite"></p>

        <div id="panel-ubicacion" class="panel-ubicacion" hidden>
            <div id="muelle" class="muelle"></div>
            <div class="acciones-ubicacion">
                <button id="boton-rotar" class="boton-secundario">↻ Rotar (R)</button>
                <button id="boton-aleatorio" class="boton-secundario">🎲 Aleatorio</button>
                <button id="boton-batalla" class="boton-iniciar" disabled>⚔️ ¡A la batalla!</button>
            </div>
        </div>

        <div class="game-stats" id="game-stats" hidden>
            <div class="stat-item">
                <span>⏱️ Tiempo</span>
                <span class="stat-value" id="tiempo-count">0:00</span>
            </div>
            <div class="stat-item">
                <span>🎯 Disparos</span>
                <span class="stat-value" id="disparos-count">0</span>
            </div>
            <div class="stat-item">
                <span>💥 Precisión</span>
                <span class="stat-value" id="precision-count">0%</span>
            </div>
            <div class="stat-item">
                <span>🚢 Enemigos</span>
                <span class="stat-value" id="barcos-count">5/5</span>
            </div>
            <div class="stat-item">
                <span>🛡️ Tu flota</span>
                <span class="stat-value" id="flota-count">5/5</span>
            </div>
        </div>

        <div id="tableros" class="tableros" hidden>
            <section class="panel-tablero" id="panel-jugador">
                <div class="panel-header">
                    <h2>🛡️ Tu flota</h2>
                    <label class="toggle-radar" id="toggle-radar-label" hidden>
                        <input type="checkbox" id="toggle-radar"> 📡 Radar de la IA
                    </label>
                </div>
                <div id="tablero-jugador" class="tablero"></div>
                <div class="leyenda-radar" id="leyenda-radar" hidden>
                    <span>Menos probable</span>
                    <span class="gradiente"></span>
                    <span>Más probable</span>
                </div>
            </section>

            <section class="panel-tablero" id="panel-enemigo" hidden>
                <div class="panel-header">
                    <h2>🎯 Flota enemiga</h2>
                </div>
                <div id="tablero-enemigo" class="tablero"></div>
            </section>
        </div>
    </div>

    <div id="mensaje-final" role="dialog" aria-modal="true" aria-labelledby="mensaje-final-texto">
        <p id="mensaje-final-texto"></p>
        <div class="acciones-final">
            <button id="boton-jugar-de-nuevo">🔄 Jugar de Nuevo</button>
            <button id="boton-ver-tableros" class="secundario">👀 Ver tableros</button>
        </div>
    </div>

    <script src="class.js"></script>
    <script src="ia.js"></script>
    <script src="functions.js"></script>
</body>
</html>
